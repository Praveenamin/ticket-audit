{% extends "admin/base_site.html" %}

{% block content_title %}{{ title }}{% endblock %}

{% block content %}
<form method="get" class="d-flex flex-wrap gap-3 align-items-end mb-4">
  <div>
    <label class="form-label mb-1">Project</label>
    <select name="project" class="form-select" onchange="this.form.submit()">
      {% for project in projects %}
        <option value="{{ project.id }}" {% if project.id == selected_project %}selected{% endif %}>{{ project.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="form-label mb-1">Year</label>
    <input type="number" name="year" value="{{ year }}" class="form-control" style="width: 6rem;">
  </div>
  <div>
    <label class="form-label mb-1">Month</label>
    <input type="number" name="month" min="1" max="12" value="{{ month }}" class="form-control" style="width: 5rem;">
  </div>
  <button type="submit" class="btn btn-primary">Update</button>
</form>

<table class="table table-striped">
  <thead>
    <tr>
      <th>{{ subtitle }} by</th>
      <th>Count</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
      <tr>
        <td>{{ row.label }}</td>
        <td>{{ row.count }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="2">No data for this project/period.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
