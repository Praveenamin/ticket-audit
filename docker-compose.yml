services:
  db:
    image: postgres:15-alpine
    container_name: whmcsaudit_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whmcsaudit_db}
      POSTGRES_USER: ${POSTGRES_USER:-whmcsaudit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - whmcsaudit_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - whmcsaudit_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whmcsaudit_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: whmcsaudit_redis
    volumes:
      - whmcsaudit_redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - whmcsaudit_network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  staging_db:
    image: mysql:8.0
    container_name: whmcsaudit_staging_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:-staging}
    volumes:
      - whmcsaudit_staging_data:/var/lib/mysql
    # Internal only -- no host port published, same pattern as the (unused
    # here) ollama service in the sibling StackSense project. Used to stage
    # WHMCS dump uploads for transformation, never reachable from outside.
    networks:
      - whmcsaudit_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${STAGING_DB_ROOT_PASSWORD:-staging}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: whmcsaudit_ollama
    volumes:
      - whmcsaudit_ollama_data:/root/.ollama
    # Internal only -- no host port published, same pattern as staging_db.
    # Dedicated to this app, not shared with the sibling StackSense project's
    # own Ollama container (confirmed: that one has no models pulled either,
    # and sits on a separate Docker network -- nothing gained by sharing).
    # One-time step after first `docker compose up -d`:
    #   docker compose exec ollama ollama pull llama3.2:latest
    networks:
      - whmcsaudit_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whmcsaudit_web
    user: "root"
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn ticket_audit.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 600
      "
    volumes:
      - .:/app
      - whmcsaudit_static:/app/staticfiles
      - whmcsaudit_media:/app/media
    ports:
      - "8010:8000"
    env_file:
      - .env
    networks:
      - whmcsaudit_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whmcsaudit_scheduler
    user: "root"
    command: >
      sh -c "
        sleep 15 &&
        exec python3 audit_scheduler.py
      "
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - whmcsaudit_media:/app/media
    env_file:
      - .env
    networks:
      - whmcsaudit_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      staging_db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  whmcsaudit_postgres_data:
  whmcsaudit_redis_data:
  whmcsaudit_static:
  whmcsaudit_media:
  whmcsaudit_ollama_data:
  whmcsaudit_staging_data:

networks:
  whmcsaudit_network:
    driver: bridge
